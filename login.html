<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroceryKo - Login</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- User Login Section -->
    <section id="loginsection">

        <h2>User Log In</h2>

        <label>Username</label><br>
        <input type="text" id="login_uname" required><br>

        <label>Password</label><br>
        <input type="password" id="login_pword" required><br>

        <button onclick="loginUser()">Log In</button>

        <p id="logMessage"></p>

    </section>

    <!-- External JavaScript -->
    <script src="js/log.js"></script>

</body>
</html>
